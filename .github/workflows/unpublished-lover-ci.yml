name: Unpublished Lover EP01 checks

on:
  push:
    branches:
      - story/unpublished-lover-ep01
  workflow_dispatch:

jobs:
  story-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit imported bilingual scene data
        run: node scripts/audit-unpublished-lover.mjs
      - name: Test EP01 approved opening and scene state machines
        run: npx vitest run src/story-engine/unpublishedLoverBlock.test.ts src/story-engine/unpublishedLoverCall.test.ts src/story-engine/unpublishedLoverEnding.test.ts src/story-engine/unpublishedLoverRuntime.test.ts src/story-engine/unpublishedLoverVisibility.test.ts src/story-engine/unpublishedLoverScene22.test.ts src/story-engine/unpublishedLoverScene23.test.ts src/story-engine/unpublishedLoverScene24.test.ts src/story-engine/unpublishedLoverScene25.test.ts src/story-engine/unpublishedLoverScene25Dialogue.test.ts src/story-engine/unpublishedLoverScene26.test.ts src/story-engine/scene29Gate.test.ts src/story-engine/scene30Opening.test.ts src/story-engine/scene30Replies.test.ts src/story-engine/scene21Handoff.test.ts src/story-engine/unpublishedLoverScene24.block.test.ts src/story-engine/unpublishedLoverScene22.history.test.ts src/story-engine/ep01PlayerSetup.test.ts src/story-engine/ep01Opening.test.ts src/story-engine/ep01OpeningChoices.test.ts src/story-engine/ep01SecondChoices.test.ts src/story-engine/ep01FirstCall.test.ts src/story-engine/ep01OpeningFlow.test.ts src/story-engine/ep01CallDialogue.test.ts src/story-engine/ep01Scene15And16.test.ts src/story-engine/ep01Scene17.test.ts src/story-engine/ep01Scene18.test.ts src/story-engine/ep01Scene19.test.ts src/story-engine/ep01Scene20.test.ts src/story-engine/ep01Scene21Opening.test.ts src/story-engine/ep01EarlyCall.test.ts src/story-engine/ep01Scene12And13.test.ts src/story-engine/ep01Scene14Call.test.ts src/story-engine/ep01Scenes12To16.integration.test.ts src/story-engine/ep01Scene10And11.test.ts src/story-engine/ep01BestFriend.test.ts
      - name: Validate partial story schema
        run: npm run story:validate -- stories/unpublished-lover/story.json
      - name: Typecheck
        run: npm run typecheck
      - name: Build EP01 private test package
        env:
          STORY_FILE: stories/unpublished-lover/story.json
        run: npm run build
      - name: Store private test package
        uses: actions/upload-artifact@v4
        with:
          name: unpublished-lover-ep01-test
          path: dist/
          retention-days: 7
