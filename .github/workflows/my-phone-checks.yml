name: My Phone development checks
on:
  push:
    branches:
      - feature/my-phone-story
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run my-phone:validate
      - run: npm run my-phone:test
      - run: npm run typecheck
      - run: npm run my-phone:build
      - name: Verify standalone build contents
        run: |
          test -s dist/index.html
          test -s dist/work.json
          test -s dist/LICENSE
          test -s dist/THIRD_PARTY_LICENSES.txt
          node -e 'const w=require("./dist/work.json"); if(w.id!=="my-phone-unlisted-love") process.exit(1); console.log("My Phone packaged:",w.title)'
      - run: npx playwright install --with-deps chrome
      - run: npx playwright test tests/my-phone.spec.ts
      - name: Package private playable build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: my-phone-private-build
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: my-phone-browser-failure
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
