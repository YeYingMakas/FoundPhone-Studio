name: My Phone development checks
on:
  push:
    branches:
      - feature/my-phone-story
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run my-phone:validate
      - run: npm run my-phone:test
      - run: npm run typecheck
      - run: npm run my-phone:build
